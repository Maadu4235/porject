<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Dwar</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --primary-color: #007bff;
            --secondary-color: #6c757d;
            --success-color: #28a745;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #007bff 0%, #0056b3 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            margin: 0;
            padding: 20px;
        }
        
        .register-container {
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            overflow: hidden;
            width: 100%;
            max-width: 600px;
            margin: 0 auto;
        }
        
        .register-header {
            background: var(--success-color);
            color: white;
            padding: 2rem;
            text-align: center;
        }
        
        .register-form {
            padding: 2rem;
        }
        
        .form-control {
            border-radius: 10px;
            padding: 12px 15px;
            border: 2px solid #e9ecef;
            transition: all 0.3s ease;
        }
        
        .form-control:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 0.2rem rgba(0,123,255,.25);
        }
        
        .btn-register {
            background: var(--success-color);
            border: none;
            padding: 12px;
            border-radius: 10px;
            font-weight: 600;
            color: white;
            transition: all 0.3s ease;
            width: 100%;
        }
        
        .btn-register:hover {
            background: #218838;
            transform: translateY(-2px);
        }
        
        .register-links a {
            color: var(--primary-color);
            text-decoration: none;
            transition: color 0.3s ease;
        }
        
        .register-links a:hover {
            color: #0056b3;
        }
        
        .brand-logo {
            font-size: 2.5rem;
            margin-bottom: 1rem;
        }
        
        .password-strength {
            height: 5px;
            border-radius: 5px;
            margin-top: 5px;
            transition: all 0.3s ease;
            background: #e9ecef;
        }
        
        .back-home {
            text-align: center;
            margin-top: 20px;
        }
        
        .back-home a {
            color: white;
            text-decoration: none;
        }
        
        .back-home a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container-fluid">
        <div class="row justify-content-center">
            <div class="col-12 col-md-8 col-lg-6">
                <div class="register-container">
                    <!-- Header -->
                    <div class="register-header">
                        <div class="brand-logo">
                            <i class="fas fa-door-open"></i> Dwar
                        </div>
                        <h2>Join Our Community</h2>
                        <p class="mb-0">Create your account in 30 seconds</p>
                    </div>
                    
                    <!-- Registration Form -->
                    <div class="register-form">
                        <div id="registerMessage"></div>
                        <form id="registerForm">
                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label class="form-label">First Name *</label>
                                    <div class="input-group">
                                        <span class="input-group-text"><i class="fas fa-user"></i></span>
                                        <input type="text" class="form-control" id="firstName" name="firstName" placeholder="John" required>
                                    </div>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label class="form-label">Last Name *</label>
                                    <div class="input-group">
                                        <span class="input-group-text"><i class="fas fa-user"></i></span>
                                        <input type="text" class="form-control" id="lastName" name="lastName" placeholder="Doe" required>
                                    </div>
                                </div>
                            </div>
                            
                            <div class="mb-3">
                                <label class="form-label">Phone Number *</label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="fas fa-phone"></i></span>
                                    <input type="tel" class="form-control" id="phone" name="phone" placeholder="+919876543210" required>
                                </div>
                                <small class="form-text text-muted">Enter your 10-digit mobile number with country code</small>
                            </div>
                            
                            <div class="mb-3">
                                <label class="form-label">User Type</label>
                                <select class="form-select" id="userType" name="userType">
                                    <option value="seeker">Job Seeker</option>
                                    <option value="provider">Service Provider</option>
                                </select>
                            </div>
                            
                            <div class="mb-3">
                                <label class="form-label">Password *</label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="fas fa-lock"></i></span>
                                    <input type="password" class="form-control" id="password" name="password" placeholder="Create a password" required minlength="6">
                                </div>
                                <div class="password-strength" id="passwordStrength"></div>
                                <small class="form-text text-muted">Password must be at least 6 characters long</small>
                            </div>
                            
                            <div class="mb-3">
                                <label class="form-label">Confirm Password *</label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="fas fa-lock"></i></span>
                                    <input type="password" class="form-control" id="confirmPassword" name="confirmPassword" placeholder="Confirm your password" required>
                                </div>
                                <small id="passwordMatch" class="form-text"></small>
                            </div>
                            
                            <div class="mb-3 form-check">
                                <input type="checkbox" class="form-check-input" id="terms" required>
                                <label class="form-check-label" for="terms">
                                    I agree to the <a href="#" target="_blank">Terms of Service</a> and <a href="#" target="_blank">Privacy Policy</a>
                                </label>
                            </div>
                            
                            <button type="submit" class="btn btn-register mb-3">
                                <i class="fas fa-user-plus me-2"></i>Create Account
                            </button>
                            
                            <div class="text-center register-links">
                                <p class="mb-0">
                                    Already have an account? <a href="login.html">Sign in here</a>
                                </p>
                            </div>
                        </form>
                    </div>
                </div>
                
                <!-- Back to Home -->
                <div class="back-home">
                    <a href="index.html">
                        <i class="fas fa-arrow-left me-2"></i>Back to Home
                    </a>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    
    <script>
        // Password strength and matching validation
        document.getElementById('password').addEventListener('input', function() {
            const password = this.value;
            const strengthBar = document.getElementById('passwordStrength');
            const strength = calculatePasswordStrength(password);
            
            strengthBar.style.width = strength.percentage + '%';
            strengthBar.style.background = strength.color;
        });
        
        document.getElementById('confirmPassword').addEventListener('input', function() {
            const password = document.getElementById('password').value;
            const confirmPassword = this.value;
            const matchText = document.getElementById('passwordMatch');
            
            if (confirmPassword) {
                if (password === confirmPassword) {
                    matchText.textContent = '✓ Passwords match';
                    matchText.className = 'form-text text-success';
                } else {
                    matchText.textContent = '✗ Passwords do not match';
                    matchText.className = 'form-text text-danger';
                }
            } else {
                matchText.textContent = '';
            }
        });
        
        function calculatePasswordStrength(password) {
            let strength = 0;
            if (password.length >= 6) strength += 25;
            if (password.length >= 8) strength += 25;
            if (/[A-Z]/.test(password)) strength += 25;
            if (/[0-9]/.test(password)) strength += 25;
            
            let color = '#dc3545'; // Red
            if (strength >= 50) color = '#ffc107'; // Yellow
            if (strength >= 75) color = '#28a745'; // Green
            
            return { percentage: strength, color: color };
        }
        
        // Registration form handler
        document.getElementById('registerForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const firstName = document.getElementById('firstName').value.trim();
            const lastName = document.getElementById('lastName').value.trim();
            const phone = document.getElementById('phone').value.trim();
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const userType = document.getElementById('userType').value;
            const terms = document.getElementById('terms').checked;
            
            const messageDiv = document.getElementById('registerMessage');
            
            // Show loading state
            const submitBtn = this.querySelector('button[type="submit"]');
            const originalText = submitBtn.innerHTML;
            submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin me-2"></i>Creating Account...';
            submitBtn.disabled = true;
            
            // Clear previous messages
            messageDiv.innerHTML = '';
            
            // Validation
            if (!firstName || !lastName || !phone || !password || !confirmPassword) {
                showMessage('Please fill in all required fields', 'danger', messageDiv);
                resetButton(submitBtn, originalText);
                return;
            }
            
            if (!terms) {
                showMessage('Please accept the Terms of Service', 'danger', messageDiv);
                resetButton(submitBtn, originalText);
                return;
            }
            
            if (password.length < 6) {
                showMessage('Password must be at least 6 characters long', 'danger', messageDiv);
                resetButton(submitBtn, originalText);
                return;
            }
            
            if (password !== confirmPassword) {
                showMessage('Passwords do not match', 'danger', messageDiv);
                resetButton(submitBtn, originalText);
                return;
            }
            
            // Create form data
            const formData = new FormData();
            formData.append('firstName', firstName);
            formData.append('lastName', lastName);
            formData.append('phone', phone);
            formData.append('password', password);
            formData.append('userType', userType);
            
            // Send registration request to PHP backend
            fetch('register.php', {
                method: 'POST',
                body: formData
            })
            .then(response => {
                if (!response.ok) {
                    throw new Error('Network response was not ok');
                }
                return response.json();
            })
            .then(data => {
                if (data.success) {
                    showMessage(data.message + ' Redirecting to login...', 'success', messageDiv);
                    
                    // Redirect to login page after success
                    setTimeout(() => {
                        window.location.href = 'login.html';
                    }, 2000);
                    
                } else {
                    showMessage(data.message, 'danger', messageDiv);
                    resetButton(submitBtn, originalText);
                }
            })
            .catch(error => {
                console.error('Error:', error);
                showMessage('Network error. Please check your connection and try again.', 'danger', messageDiv);
                resetButton(submitBtn, originalText);
            });
        });
        
        function showMessage(message, type, container) {
            const icon = type === 'success' ? 'fa-check-circle' : 'fa-exclamation-triangle';
            container.innerHTML = `
                <div class="alert alert-${type} alert-dismissible fade show">
                    <i class="fas ${icon} me-2"></i>
                    ${message}
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>
            `;
        }
        
        function resetButton(button, originalText) {
            button.innerHTML = originalText;
            button.disabled = false;
        }
        
        // Check if already logged in
        document.addEventListener('DOMContentLoaded', function() {
            console.log('Register page loaded successfully');
            
            // Test if PHP files are accessible
            fetch('register.php')
                .then(response => {
                    console.log('Register.php status:', response.status);
                })
                .catch(error => {
                    console.error('Cannot access register.php:', error);
                });
        });
    </script>
</body>
</html>

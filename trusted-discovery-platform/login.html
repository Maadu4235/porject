<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Dwar</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --primary-color: #007bff;
            --secondary-color: #6c757d;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #007bff 0%, #0056b3 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
        }
        
        .login-container {
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            overflow: hidden;
            animation: popIn 1s cubic-bezier(0.23, 1, 0.32, 1);
        }
        
        @keyframes popIn {
            0% {
                transform: scale(0.8) translateY(40px);
                opacity: 0;
            }
            60% {
                transform: scale(1.05) translateY(-10px);
                opacity: 1;
            }
            100% {
                transform: scale(1) translateY(0);
                opacity: 1;
            }
        }
        
        .login-header {
            background: var(--primary-color);
            color: white;
            padding: 2rem;
            text-align: center;
            animation: fadeSlideDown 1.2s ease;
        }
        
        @keyframes fadeSlideDown {
            0% {
                opacity: 0;
                transform: translateY(-40px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .login-form {
            padding: 2rem;
        }
        
        .form-control {
            border-radius: 10px;
            padding: 12px 15px;
            border: 2px solid #e9ecef;
            transition: all 0.3s ease;
        }
        
        .form-control:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 0.2rem rgba(0,123,255,.25);
        }
        
        .btn-login {
            background: var(--primary-color);
            border: none;
            padding: 12px;
            border-radius: 10px;
            font-weight: 600;
            transition: box-shadow 0.2s, transform 0.2s;
        }
        
        .btn-login:hover {
            background: #0056b3;
            transform: translateY(-2px) scale(1.05);
            box-shadow: 0 4px 16px rgba(0,123,255,0.18);
        }
        
        .login-links a {
            color: var(--primary-color);
            text-decoration: none;
            transition: color 0.3s ease;
        }
        
        .login-links a:hover {
            color: #0056b3;
        }
        
        .brand-logo {
            font-size: 2.5rem;
            margin-bottom: 1rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5">
                <div class="login-container">
                    <!-- Header -->
                    <div class="login-header">
                        <div class="brand-logo">
                            <i class="fas fa-door-open"></i> Dwar
                        </div>
                        <h2>Welcome Back</h2>
                        <p class="mb-0">Sign in to your account</p>
                    </div>
                    
                    <!-- Login Form -->
                    <div class="login-form">
                        <div id="loginMessage"></div>
                        <form id="loginForm">
                            <div class="mb-3">
                                <label class="form-label">Phone Number</label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="fas fa-phone"></i></span>
                                    <input type="tel" class="form-control" id="phone" name="phone" placeholder="+919876543210" required>
                                </div>
                                <small class="form-text text-muted">Use +919876543210 for demo</small>
                            </div>
                            
                            <div class="mb-3">
                                <label class="form-label">Password</label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="fas fa-lock"></i></span>
                                    <input type="password" class="form-control" id="password" name="password" placeholder="Enter your password" required>
                                </div>
                                <small class="form-text text-muted">Use 'password' for demo</small>
                            </div>
                            
                            <div class="mb-3 form-check">
                                <input type="checkbox" class="form-check-input" id="rememberMe">
                                <label class="form-check-label" for="rememberMe">Remember me</label>
                            </div>
                            
                            <button type="submit" class="btn btn-login w-100 mb-3">
                                <i class="fas fa-sign-in-alt me-2"></i>Sign In
                            </button>
                            
                            <div class="text-center login-links">
                                <p class="mb-2">
                                    <a href="forgot-password.html">Forgot your password?</a>
                                </p>
                                <p class="mb-0">
                                    Don't have an account? <a href="register.html">Create one here</a>
                                </p>
                            </div>
                        </form>
                    </div>
                </div>
                
                <!-- Back to Home -->
                <div class="text-center mt-3">
                    <a href="index.html" class="text-white text-decoration-none">
                        <i class="fas fa-arrow-left me-2"></i>Back to Home
                    </a>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    
    <script>
        // Real database authentication
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
                const phone = document.getElementById('phone').value;
                const password = document.getElementById('password').value;
                const messageDiv = document.getElementById('loginMessage');
            
            // Show loading state
            const submitBtn = this.querySelector('button[type="submit"]');
            const originalText = submitBtn.innerHTML;
            submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin me-2"></i>Signing In...';
            submitBtn.disabled = true;
            
                // Show console logs for debugging
                console.log('=== LOGIN ATTEMPT ===');
                console.log('Phone:', phone);
                console.log('Password length:', password.length);
            
                // Create FormData
                const formData = new FormData();
                formData.append('phone', phone);
                formData.append('password', password);
            fetch('login.php', {
                method: 'POST',
                body: formData
            })
                .then(response => {
                    console.log('Response status:', response.status);
                    return response.text();
                })
                .then(text => {
                    console.log('Raw response:', text);
                    const data = JSON.parse(text);
                    console.log('Parsed response:', data);
                if (data.success) {
                        console.log('LOGIN SUCCESS!');
                    showMessage(data.message, 'success', messageDiv);
                    // Store user info in localStorage for frontend
                    localStorage.setItem('dwar_user_logged_in', 'true');
                    localStorage.setItem('dwar_user_name', data.user_name);
                    localStorage.setItem('dwar_user_type', data.user_type);
                    localStorage.setItem('dwar_user_phone', data.user_phone);
                        console.log('Redirecting...');
                    setTimeout(() => {
                        window.location.href = 'index.html';
                        }, 1000);
                    } else {
                        console.log('LOGIN FAILED:', data.message);
                        showMessage(data.message || 'Login failed', 'danger', messageDiv);
                    submitBtn.innerHTML = originalText;
                    submitBtn.disabled = false;
                }
            })
            .catch(error => {
                    console.error('=== NETWORK ERROR ===', error);
                    showMessage('Error: ' + error.message, 'danger', messageDiv);
                submitBtn.innerHTML = originalText;
                submitBtn.disabled = false;
            });
        });
        
        function showMessage(message, type, container) {
            container.innerHTML = `
                    <div class="alert alert-${type} alert-dismissible fade show" role="alert">
                        <i class="fas fa-${type === 'success' ? 'check-circle' : 'exclamation-triangle'} me-2"></i>
                    ${message}
                        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>
            `;
        }
        
            // Check if already logged in when page loads
            window.addEventListener('load', function() {
                console.log('Login page loaded');
            fetch('check_login.php')
                    .then(r => r.json())
                    .then(data => {
                        console.log('check_login response:', data);
                        if (data.logged_in) {
                            console.log('User already logged in, redirecting...');
                    window.location.href = 'index.html';
                        }
                    })
                    .catch(e => console.error('check_login error:', e));
            });
    </script>
</body>
</html>
